  summary_zh: 复现最便宜可交割券 CTD、隐含回购利率 IRR 与净基差 BNOC；与买入持有/简单对冲对照；扫描融资与 CTD 切换情景；给出全成本覆盖、CF 敏感性与容量边界。研究型 Agent，非生产因子包。
  summary_en: Reproduce cheapest-to-deliver, implied repo rate and net basis for CGB futures; compare against buy-and-hold and naive hedge; scan financing/CTD-switch scenarios; deliver executable and capacity boundaries. Research agent, not a production alpha factor.
